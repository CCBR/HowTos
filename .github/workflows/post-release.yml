name: post-release

on:
  release:
    types:
      - published

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: CCBR/actions/post-release@v0.8
        with:
          github-token: ${{ github.token }}
          # The ./ prefix prevents R package detection from substituting NEWS.md.
          changelog-filepath: ./CHANGELOG.md
          # This repository has an R DESCRIPTION file, but releases use VERSION.
          # Point elsewhere to disable the action's automatic R-package detection.
          description-filepath: .github/nonexistent-DESCRIPTION
