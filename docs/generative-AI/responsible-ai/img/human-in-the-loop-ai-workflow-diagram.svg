<?xml version="1.0" encoding="UTF-8"?> <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Human-in-the-loop AI workflow diagram"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3E4C63"></path></marker></defs><rect width="1600" height="900" fill="white"></rect><text x="60" y="62.0" font-family="Carlito, Calibri, Arial, Helvetica, sans-serif" font-size="34" fill="#0B1F3A" text-anchor="start" font-weight="bold" dominant-baseline="middle">Human-in-the-loop AI workflow (reference diagram)</text><text x="60" y="100.0" font-family="Carlito, Calibri, Arial, Helvetica, sans-serif" font-size="19" fill="#6B7A90" text-anchor="start" font-weight="normal" dominant-baseline="middle">Where the human sits, what the human decides, and how each decision feeds back into the system</text><rect x="60" y="400" width="180" height="110" rx="10" fill="#F3F5F8" stroke="#C9D2DE" stroke-width="2"></rect><text x="150.0" y="442.5" font-family="Carlito, Calibri, Arial, Helvetica, sans-serif" font-size="20" fill="#1B2A41" text-anchor="middle" font-weight="normal" dominant-baseline="middle">1. Input</text><text x="150.0" y="467.5" font-family="Carlito, Calibri, Arial, Helvetica, sans-serif" font-size="20" fill="#1B2A41" text-anchor="middle" font-weight="normal" dominant-baseline="middle">or trigger event</text><polyline points="240,455.0 285,455.0" fill="none" stroke="#3E4C63" stroke-width="2.5" marker-end="url(#arr)" stroke-linejoin="round"></polyline><rect x="285" y="400" width="250" height="110" rx="10" fill="#E3F3F5" stroke="#0E8C9C" stroke-width="2"></rect><text x="410.0" y="442.5" font-family="Carlito, Calibri, Arial, Helvetica, sans-serif" font-size="20" fill="#1B2A41" text-anchor="middle" font-weight="bold" dominant-baseline="middle">2. AI model or agent</text><text x="410.0" y="467.5" font-family="Carlito, Calibri, Arial, Helvetica, sans-serif" font-size="20" fill="#1B2A41" text-anchor="middle" font-weight="bold" dominant-baseline="middle">produces a proposal</text><polyline points="535,455.0 585,455.0" fill="none" stroke="#3E4C63" stroke-width="2.5" marker-end="url(#arr)" stroke-linejoin="round"></polyline><polygon points="700,375.0 815.0,455.0 700,535.0 585.0,455.0" fill="#F3F5F8" stroke="#0B1F3A" stroke-width="2"></polygon><text x="700" y="443.1" font-family="Carlito, Calibri, Arial, Helvetica, sans-serif" font-size="19" fill="#1B2A41" text-anchor="middle" font-weight="bold" dominant-baseline="middle">3. Risk and</text><text x="700" y="466.9" font-family="Carlito, Calibri, Arial, Helvetica, sans-serif" font-size="19" fill="#1B2A41" text-anchor="middle" font-weight="bold" dominant-baseline="middle">confidence gate</text><polyline points="700,375.0 700,250 900,250" fill="none" stroke="#3E4C63" stroke-width="2.5" marker-end="url(#arr)" stroke-linejoin="round"></polyline><rect x="615.0" y="181.0" width="290.0" height="48.0" rx="4" fill="white"></rect><text x="760" y="195.0" font-family="Carlito, Calibri, Arial, Helvetica, sans-serif" font-size="16" fill="#6B7A90" text-anchor="middle" font-weight="normal" dominant-baseline="middle">Low risk and</text><text x="760" y="215.0" font-family="Carlito, Calibri, Arial, Helvetica, sans-serif" font-size="16" fill="#6B7A90" text-anchor="middle" font-weight="normal" dominant-baseline="middle">confidence at or above threshold</text><rect x="900" y="205" width="220" height="90" rx="10" fill="#E6F5EE" stroke="#2E9E6B" stroke-width="2"></rect><text x="1010.0" y="250.0" font-family="Carlito, Calibri, Arial, Helvetica, sans-serif" font-size="20" fill="#1B2A41" text-anchor="middle" font-weight="bold" dominant-baseline="middle">4a. Auto-approve</text><polyline points="700,535.0 700,640 900,640" fill="none" stroke="#3E4C63" stroke-width="2.5" marker-end="url(#arr)" stroke-linejoin="round"></polyline><rect x="615.0" y="666.0" width="290.0" height="48.0" rx="4" fill="white"></rect><text x="760" y="680.0" font-family="Carlito, Calibri, Arial, Helvetica, sans-serif" font-size="16" fill="#6B7A90" text-anchor="middle" font-weight="normal" dominant-baseline="middle">High risk, low confidence,</text><text x="760" y="700.0" font-family="Carlito, Calibri, Arial, Helvetica, sans-serif" font-size="16" fill="#6B7A90" text-anchor="middle" font-weight="normal" dominant-baseline="middle">or novel input</text><rect x="900" y="595" width="300" height="120" rx="10" fill="#0B1F3A" stroke="#0B1F3A" stroke-width="2"></rect><text x="1050.0" y="642.5" font-family="Carlito, Calibri, Arial, Helvetica, sans-serif" font-size="20" fill="white" text-anchor="middle" font-weight="bold" dominant-baseline="middle">4b. Human review</text><text x="1050.0" y="667.5" font-family="Carlito, Calibri, Arial, Helvetica, sans-serif" font-size="20" fill="white" text-anchor="middle" font-weight="bold" dominant-baseline="middle">Approve · Edit · Reject</text><circle cx="1165" cy="647.4" r="9.799999999999999" fill="white"></circle><path d="M 1146.8 679.6 a 26 26 0 0 1 36.4 0 z" fill="white"></path><polyline points="1120,250 1200,250 1200,400 1260,455" fill="none" stroke="#3E4C63" stroke-width="2.5" stroke-linejoin="round"></polyline><polyline points="1200,715 1200,455 1260,455" fill="none" stroke="#3E4C63" stroke-width="2.5" marker-end="url(#arr)" stroke-linejoin="round"></polyline><rect x="1260" y="400" width="130" height="110" rx="10" fill="#F3F5F8" stroke="#C9D2DE" stroke-width="2"></rect><text x="1325.0" y="442.5" font-family="Carlito, Calibri, Arial, Helvetica, sans-serif" font-size="20" fill="#1B2A41" text-anchor="middle" font-weight="bold" dominant-baseline="middle">5. Execute</text><text x="1325.0" y="467.5" font-family="Carlito, Calibri, Arial, Helvetica, sans-serif" font-size="20" fill="#1B2A41" text-anchor="middle" font-weight="bold" dominant-baseline="middle">action</text><polyline points="1390,455.0 1425,455.0" fill="none" stroke="#3E4C63" stroke-width="2.5" marker-end="url(#arr)" stroke-linejoin="round"></polyline><rect x="1425" y="400" width="115" height="110" rx="10" fill="#F3F5F8" stroke="#C9D2DE" stroke-width="2"></rect><text x="1482.5" y="442.5" font-family="Carlito, Calibri, Arial, Helvetica, sans-serif" font-size="20" fill="#1B2A41" text-anchor="middle" font-weight="bold" dominant-baseline="middle">6. Audit</text><text x="1482.5" y="467.5" font-family="Carlito, Calibri, Arial, Helvetica, sans-serif" font-size="20" fill="#1B2A41" text-anchor="middle" font-weight="bold" dominant-baseline="middle">log</text><polyline points="1050,715 1050,760 470,760 470,512" fill="none" stroke="#D64545" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arr)" stroke-linejoin="round"></polyline><rect x="530.0" y="746.0" width="400.0" height="28.0" rx="4" fill="white"></rect><text x="730" y="760.0" font-family="Carlito, Calibri, Arial, Helvetica, sans-serif" font-size="16" fill="#D64545" text-anchor="middle" font-weight="normal" dominant-baseline="middle">Reject: stop, or re-run with the reviewer's feedback</text><polyline points="1482,510 1482,815 330,815 330,512" fill="none" stroke="#0E8C9C" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arr)" stroke-linejoin="round"></polyline><rect x="440.0" y="801.0" width="760.0" height="28.0" rx="4" fill="white"></rect><text x="820" y="815.0" font-family="Carlito, Calibri, Arial, Helvetica, sans-serif" font-size="16" fill="#0E8C9C" text-anchor="middle" font-weight="normal" dominant-baseline="middle">7. Feedback loop: every human decision becomes evaluation data. Retune thresholds, prompts, and models.</text><line x1="60" y1="842" x2="1540" y2="842" stroke="#C9D2DE" stroke-width="1.5"></line><text x="60" y="868.0" font-family="Carlito, Calibri, Arial, Helvetica, sans-serif" font-size="15" fill="#6B7A90" text-anchor="start" font-weight="normal" dominant-baseline="middle">Source: Uvik Software · uvik.net/blog/human-in-the-loop-ai/ · Licensed CC BY 4.0. Reuse with a link.</text></svg> 